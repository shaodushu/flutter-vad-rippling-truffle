name: flutter_voice_demo
description: "LiveKit Voice Chat - AI Voice Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # LiveKit WebRTC SFU client
  livekit_client: ^2.8.0

  # Permissions
  permission_handler: ^11.3.1

  # Environment variables (.env)
  flutter_dotenv: ^5.2.1
  audio_session: ^0.2.3

  # Local VAD (pure Dart DFSMN)
  fireredvad:
    git: https://github.com/voxcom-us/fireredvad-dart.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/vad/weights.bin
    - assets/vad/cmvn.json
