name: flutter_voice_demo
description: "Flutter Demo - VAD + ASR + LLM + TTS Voice Conversation"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # VAD - Silero Voice Activity Detection (端侧 ONNX Runtime)
  flutter_silero_vad:
    path: packages/flutter_silero_vad

  # Audio Recording
  record: ^7.0.0

  # ASR - Speech to Text
  speech_to_text: ^7.0.0

  # TTS - Text to Speech
  flutter_tts: ^4.2.2

  # LLM HTTP Client
  http: ^1.3.0

  # Permissions
  permission_handler: ^11.3.1

  # File storage (VAD model extraction)
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/silero_vad.onnx
